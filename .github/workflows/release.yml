name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --test-dir build/windows-msvc -C Release --output-on-failure

      - name: Validate release version
        shell: pwsh
        run: |
          $TagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $ProjectLine = Select-String CMakeLists.txt -Pattern 'project\(Quickdraw VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if ($null -eq $ProjectLine) {
            throw "Could not read the Quickdraw version from CMakeLists.txt."
          }
          $ProjectVersion = $ProjectLine.Matches[0].Groups[1].Value
          if ($ProjectVersion -ne $TagVersion) {
            throw "Release tag version $TagVersion does not match project version $ProjectVersion."
          }
          "QUICKDRAW_VERSION=$TagVersion" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: >-
          ./scripts/build-installer.ps1
          -Version "$env:QUICKDRAW_VERSION"
          -ExecutablePath build/windows-msvc/Release/Quickdraw.exe
          -OutputDirectory dist

      - name: Test installer lifecycle
        shell: pwsh
        run: >-
          ./scripts/test-installer.ps1
          -InstallerPath "dist/Quickdraw-Setup-$($env:QUICKDRAW_VERSION).exe"

      - name: Prepare release files
        shell: pwsh
        run: |
          $Version = $env:QUICKDRAW_VERSION
          $PackageName = "Quickdraw-$Version-win-x64"
          New-Item dist -ItemType Directory -Force | Out-Null
          New-Item "dist/$PackageName" -ItemType Directory -Force | Out-Null
          Copy-Item build/windows-msvc/Release/Quickdraw.exe dist/Quickdraw.exe
          Copy-Item dist/Quickdraw.exe "dist/$PackageName/Quickdraw.exe"
          Copy-Item README.md "dist/$PackageName/README.md"
          Copy-Item LICENSE "dist/$PackageName/LICENSE"
          Compress-Archive -Path "dist/$PackageName/*" -DestinationPath "dist/$PackageName.zip"
          $ExeHash = (Get-FileHash dist/Quickdraw.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$ExeHash  Quickdraw.exe" | Set-Content dist/Quickdraw.exe.sha256 -Encoding ascii
          $ZipHash = (Get-FileHash "dist/$PackageName.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$ZipHash  $PackageName.zip" | Set-Content "dist/$PackageName.zip.sha256" -Encoding ascii
          $SetupName = "Quickdraw-Setup-$Version.exe"
          $SetupHash = (Get-FileHash "dist/$SetupName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$SetupHash  $SetupName" | Set-Content "dist/$SetupName.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = "${{ github.ref_name }}" -replace '^v', ''
          $Archive = "dist/Quickdraw-$Version-win-x64.zip"
          $Installer = "dist/Quickdraw-Setup-$Version.exe"
          gh release view "${{ github.ref_name }}" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" `
              $Installer `
              "$Installer.sha256" `
              dist/Quickdraw.exe `
              dist/Quickdraw.exe.sha256 `
              $Archive `
              "$Archive.sha256" `
              --clobber
          } else {
            gh release create "${{ github.ref_name }}" `
              $Installer `
              "$Installer.sha256" `
              dist/Quickdraw.exe `
              dist/Quickdraw.exe.sha256 `
              $Archive `
              "$Archive.sha256" `
              --verify-tag `
              --generate-notes `
              --title "Quickdraw ${{ github.ref_name }}"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with exit code $LASTEXITCODE."
          }
